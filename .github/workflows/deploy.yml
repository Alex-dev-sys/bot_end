name: Deploy Bot

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          # password: ${{ secrets.PASSWORD }}
          debug: true
          source: "pvp_bot.py,requirements.txt,README.md"
          target: "/root/pvp-bot"
          strip_components: 0

      - name: Restart Bot
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          # password: ${{ secrets.PASSWORD }}
          script: |
            cd /root/pvp-bot
            # Check if venv exists, create if not
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            # Install deps
            source venv/bin/activate
            pip install -r requirements.txt
            pip install "python-telegram-bot[job-queue]"
            
            # Restart bot (kill old, start new)
            pkill -f pvp_bot.py || true
            nohup python pvp_bot.py > bot.log 2>&1 &
            echo "Bot deployed and restarted!"
